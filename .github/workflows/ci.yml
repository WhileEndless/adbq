name: ci

# Fast feedback that the app still builds and its tests pass. The heavier,
# artifact-producing build lives in release.yml (tag-triggered).
#
# The packaged build runs on macOS only, because that is the only platform adbq
# ships. Note that the test job below still compiles the whole Go side on Linux,
# so a portability regression is caught there without paying for a full Wails
# build of a target nobody downloads.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the repo. A compromised build-time dependency
# running here can't push, open PRs, or write packages with this token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^build/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: Unit tests (no device)
        env:
          ADBQ_SKIP_DEVICE: "1"
        run: go test ./...

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Build
        shell: bash
        run: wails build -platform darwin/universal -clean -trimpath -ldflags "-s -w"
