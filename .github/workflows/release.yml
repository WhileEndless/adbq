name: release

# Build the macOS binary and attach it to a GitHub Release. Triggered by
# pushing a semver tag, e.g. `v0.1.0-beta`.
#
# macOS only: that is the platform adbq is developed on, run on, and actually
# verified against hardware. The Go and React code has no macOS-specific
# assumptions and Wails targets the others, but shipping a build nobody has
# ever launched is a promise this project cannot keep — an untested download
# in a Releases page reads as support.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and release"
        required: true

permissions:
  contents: write

env:
  WAILS_VERSION: v2.12.0

jobs:
  # Guard the single source of truth: the pushed tag must equal the literal in
  # internal/version/version.go. This keeps that file the only place a version
  # is ever edited.
  verify-version:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Tag must match internal/version/version.go
        run: |
          file_ver=$(awk -F'"' '/Version = "/{print $2; exit}' internal/version/version.go)
          tag_ver="${GITHUB_REF_NAME}"
          echo "file=$file_ver tag=$tag_ver"
          if [ "$file_ver" != "$tag_ver" ]; then
            echo "::error::Tag ($tag_ver) does not match version.go ($file_ver). Bump the file and retag."
            exit 1
          fi

  build:
    needs: [verify-version]
    # workflow_dispatch has no verify-version job, so don't hard-require it.
    if: always() && (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped')
    runs-on: macos-latest
    env:
      # Universal, so one download runs on both Apple Silicon and Intel.
      PLATFORM: darwin/universal
      ARTIFACT: adbq-macos-universal
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Resolve version from source of truth
        id: ver
        shell: bash
        run: |
          v=$(awk -F'"' '/Version = "/{print $2; exit}' internal/version/version.go)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          wails build -platform "$PLATFORM" -clean -trimpath \
            -ldflags "-s -w -X adbq/internal/version.Version=${{ steps.ver.outputs.version }}"

      - name: Package
        run: |
          cd build/bin
          ditto -c -k --keepParent adbq.app "../../$ARTIFACT.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}.zip
          if-no-files-found: error

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd dist
          shopt -s nullglob
          # Write outside dist first so the sums file can't hash itself.
          sha256sum *.zip > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "adbq ${GITHUB_REF_NAME}" \
            --generate-notes \
            --prerelease \
            dist/* \
          || gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
